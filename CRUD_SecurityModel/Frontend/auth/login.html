<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - SecurityModel</title>

    <link rel="icon" href="../assets/img/img-home.png" type="image/x-icon" />

    <!-- Liberias -->
    <link rel="stylesheet" href="../vendor/bootstrap-5.3.5/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="../vendor/SweetAlert2/css/sweetalert2.min.css" type="text/css">

    <!-- Focus -->
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Iniciar Sesión</h2>
        <form id="loginForm" class="form d-flex flex-column align-items-center">
            <div class="mb-3 w-100" style="max-width: 400px;">
                <label for="username" class="form-label">Username:</label>
                <input type="text" name="username" id="username" class="form-control" required>
            </div>
            <div class="mb-3 w-100" style="max-width: 400px;">
                <label for="password" class="form-label">Password:</label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>
        <div class="mt-3 text-center">
            <a href="register.html">¿No tienes cuenta? Regístrate</a>
        </div>
    </div>

    <!-- Librerias -->
    <script src="../vendor/bootstrap-5.3.5/js/bootstrap.bundle.min.js"></script>
    <script src="../vendor/SweetAlert2/js/sweetalert2.min.js"></script>
    
    <!-- Focus -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
