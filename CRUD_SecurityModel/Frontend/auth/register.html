<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Registro - SecurityModel</title>

    <link rel="icon" href="../assets/img/img-home.png" type="image/x-icon" />

    <!-- Librerias -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Focus -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center">Registro de Usuario</h2>
        <form id="registerForm" class="form d-flex flex-column align-items-center">
            <div class="mb-3 w-100" style="max-width: 400px;">
                <h4>Datos Personales</h4>
                <input name="name" class="form-control mb-2" placeholder="Nombre" required />

                <input name="lastName" class="form-control mb-2" placeholder="Apellido" required />

                <input name="email" type="email" class="form-control mb-2" placeholder="Email" required />

                <select name="documentType" id="documentType" class="form-control mb-2" required>
                    <option value="" selected disabled>Seleccione Tipo de Documento</option>
                    <option value="RC">Registro Civil</option>
                    <option value="TI">Tarjeta de Identidad</option>
                    <option value="CC">Cedula de Ciudadania</option>
                    <option value="CE">Cedula de Extranjeria</option>
                    <option value="NIT">N° Identificación Tributaria</option>
                    <option value="PP">Pasaporte</option>
                </select>

                <input type="text" name="documentNumber" id="documentNumber" class="form-control mb-2" placeholder="Digite el Número de Documento" required 
                    pattern="[0-9]{1,12}" maxlength="12" title="Solo números, máximo 12 dígitos">
                
                <input type="text" name="phone" id="phone" class="form-control mb-2" placeholder="Digite el Número Celular" required 
                    pattern="[0-9]{1,15}" maxlength="10" title="Solo numeros, máximo 10 digitos">

                <input name="address" class="form-control mb-2" placeholder="Dirección" required />

                <select name="bloodType" id="bloodType" class="form-control mb-2" required>
                    <option value="" selected disabled>Seleccione Tipo de Sangre</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <div class="mb-3 w-100" style="max-width: 400px;">
                <h4>Datos de Usuario</h4>
                <input name="username" class="form-control mb-2" placeholder="Username" required />
                <input name="password" type="password" class="form-control mb-2" placeholder="Password" required />
            </div>
            
            <div class="mb-3 w-100" style="max-width: 400px;">
                <label for="rolId">Rol:</label>
                <select name="rolId" id="rolId" class="form-select mb-3" required>
                    <option selected disabled value="">Seleccione Rol</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Registrarse</button>
        </form>

        <div class="mt-3 text-center">
            <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>

    <!-- Liberias -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Focus -->
    <script type="module" src="js/register.js"></script>
</body>
</html>
