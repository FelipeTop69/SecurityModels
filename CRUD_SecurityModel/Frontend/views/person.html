<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>SecurityModel</title>

    <link rel="icon" href="../assets/img/img-home.png" type="image/x-icon" />

    <!-- Liberias -->
    <link rel="stylesheet" href="../vendor/bootstrap-5.3.5/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="../vendor/SweetAlert2/css/sweetalert2.min.css" type="text/css">
    <link rel="stylesheet" href="../vendor/fontawesome-6.7.2/css/all.min.css" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i">

    <!-- Custom styles for this template -->
    <link rel="stylesheet" href="../assets/css/sb-admin-2.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body id="page-top">

    <div id="wrapper">

        <div id="sidebarContainer"></div>

        <div id="content-wrapper" class="d-flex flex-column img-fluid">
            <div id="content">
                <div class="container-fluid w-100">
                    <h1 class="h3 mb-2 mt-4  text-center titulo-contenedor">TABLA PERSON</h1>
                    <div class="d-flex justify-content-center align-items-center m-4">
                        <button class="btn btn-primary" id="botonRegistrar" type="button" data-bs-toggle="modal" data-bs-target="#modalRegistroPerson">
                            REGISTRAR PERSON
                            <i class="fa-regular fa-file"></i>
                        </button>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h5 class="m-0 font-weight-bold text-primary">Person Registrados</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="dataTable"  cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>N°</th>
                                            <th>Name</th>
                                            <th>LastName</th>
                                            <th>Email</th>
                                            <th>DocumentType</th>
                                            <th>DocumentNumber</th>
                                            <th>Phone</th>
                                            <th>Address</th>
                                            <th>BloodType</th>
                                            <th>Estado</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="cuerpoTabla">
                                        
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>  
                </div>
            </div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>
    <!-- Modal Registro -->
    <div class="modal fade" id="modalRegistroPerson" tabindex="-1" aria-labelledby="modalRegistroPerson" aria-hidden="true">
        <div class=" modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title titulo-modal fs-5" id="modalRegistro">Registrar Person</h1>
                </div>
                <div class="modal-body">
                    <form id="formularioPerson" class="row formulario-registro needs-validation">
                        <div class="col-md-12">
                            <!-- Name -->
                            <label for="name" class="form-label">Name</label>
                                <input type="text" name="name" id="name" class="form-control" placeholder="Digite el Name" required>

                            <!-- Last Name -->
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" name="lastName" id="lastName" class="form-control" placeholder="Digite el Apellido" required>

                            <!-- Email -->
                            <label for="email" class="form-label">Email</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="Digite el Email" required>

                            <!-- Document Type -->
                            <label for="documentType" class="form-label">Tipo de Documento</label>
                            <select name="documentType" id="documentType" class="form-control" required>
                                <option value="" selected disabled>Seleccione un tipo</option>
                                <option value="RC">Registro Civil</option>
                                <option value="TI">Tarjeta de Identidad</option>
                                <option value="CC">Cedula de Ciudadania</option>
                                <option value="CE">Cedula de Extranjeria</option>
                                <option value="NIT">N° Identificación Tributaria</option>
                                <option value="PP">Pasaporte</option>
                            </select>

                            <!-- Document Number -->
                            <label for="documentNumber" class="form-label">Numero de Documento</label>
                            <input type="text" name="documentNumber" id="documentNumber" class="form-control" placeholder="Digite el Número de Documento" required 
                                pattern="[0-9]{1,10}" maxlength="12" title="Solo números, máximo 12 dígitos">

                            <!-- Phone -->
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" name="phone" id="phone" class="form-control" placeholder="Digite el Phone" required 
                                pattern="[0-9]{1,15}" maxlength="10" title="Solo numeros, máximo 10 digitos">

                            <!-- Address -->
                            <label for="address" class="form-label">Dirección</label>
                            <input type="text" name="address" id="address" class="form-control" placeholder="Digite la Dirección" required>

                            <!-- Blood Type -->
                            <label for="bloodType" class="form-label">Tipo de Sangre</label>
                            <select name="bloodType" id="bloodType" class="form-control" required>
                                <option value="" selected disabled>Seleccione un tipo</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                        <br>
                        <div class="col-md-12 text-center">
                            <button type="submit" class="btn btn-success">Guardar datos</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Fin Modal Registro -->

    <!-- Modal Actualizar -->
    <div class="modal fade" id="modalActualizarPerson" tabindex="-1" aria-labelledby="modalActualizarPerson" aria-hidden="true">
        <div class=" modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title titulo-modal fs-5" id="modalActualizar">Actualizar Person</h1>
                </div>
                <div class="modal-body" id="cuerpoModalActualizarPerson">
                    
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Fin Modal Actualizar -->

    <!-- Liberias -->
    <script src="../vendor/bootstrap-5.3.5/js/bootstrap.bundle.min.js"></script>
    <script src="../vendor/SweetAlert2/js/sweetalert2.min.js"></script>
    <script src="../vendor/jquery/jquery.min.js"></script>
    <script src="../vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Focus -->
    <script type="module" src="../assets/js/mainPerson.js"></script>
</body>
</html>
