    <script>
        function mostrarConexionActual() {
            const db = localStorage.getItem("X-DB-Provider") || "sqlserver";
            const label = {
                sqlserver: "SQL Server",
                mysql: "MySQL",
                postgresql: "PostgreSQL"
            };
            const conexionLabel = document.getElementById("conexionActual");
            if (conexionLabel) {
                conexionLabel.textContent = `BD: ${label[db] || db}`;
            }
        }

        function configurarCambioDeConexion() {
            const btn = document.getElementById("cambiarConexion");
            if (!btn) return;

            btn.addEventListener("click", () => {
                Swal.fire({
                    title: "Selecciona una base de datos",
                    input: "select",
                    inputOptions: {
                        sqlserver: "SQL Server",
                        postgresql: "PostgreSQL",
                        mysql: "MySQL"
                    },
                    inputPlaceholder: "Selecciona un proveedor",
                    showCancelButton: true,
                    confirmButtonText: "Conectar"
                }).then((result) => {
                    if (result.isConfirmed && result.value) {
                        localStorage.setItem("X-DB-Provider", result.value);
                        mostrarConexionActual();
                        Swal.fire("¡Conexión actualizada!", `Base de datos: ${result.value}`, "success");
                    }
                });
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (!localStorage.getItem("X-DB-Provider")) {
                localStorage.setItem("X-DB-Provider", "sqlserver");
            }

            mostrarConexionActual();
            configurarCambioDeConexion();
        });
    </script>
